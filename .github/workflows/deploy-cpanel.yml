name: Deploy cPanel via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to cPanel (Apache + PHP)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🐘 Ensure PHP CLI & pdo_sqlite
        run: |
          if ! php -m | grep -qi '^pdo_sqlite$'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-sqlite3
          fi

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Astro Static Site
        run: npm run build

      - name: 🧪 Run Tests
        run: npm test

      - name: 🔐 Generate dist/api/config.local.php from Encrypted Secrets (if configured)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_PASS" ]; then
            php -r '
              $cfg = [
                "session" => [
                  "secure"   => true,
                  "httponly" => true,
                  "samesite" => "Lax",
                ],
                "security" => [
                  "require_https"          => true,
                  "password_login_enabled" => false,
                ],
                "mail" => [
                  "driver"          => "smtp",
                  "from_email"      => getenv("SMTP_USER") ?: "no-reply@sha256.us",
                  "from_name"       => "SHA256.US — Bóveda Pericial",
                  "app_url"         => "https://sha256.us",
                  "smtp_host"       => getenv("SMTP_HOST") ?: "sha256.us",
                  "smtp_port"       => (int)(getenv("SMTP_PORT") ?: 465),
                  "smtp_encryption" => getenv("SMTP_ENCRYPTION") ?: "ssl",
                  "smtp_user"       => getenv("SMTP_USER") ?: "no-reply@sha256.us",
                  "smtp_pass"       => getenv("SMTP_PASS") ?: "",
                ],
              ];
              $code = "<?php\ndeclare(strict_types=1);\nreturn " . var_export($cfg, true) . ";\n";
              file_put_contents("dist/api/config.local.php", $code);
            '
            echo "✅ dist/api/config.local.php generado desde GitHub Secrets"
          else
            echo "ℹ️ SMTP_PASS no definido en GitHub Secrets; se conserva config.local.php existente en cPanel o mail() nativo."
          fi

      - name: 📂 Deploy dist/ to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          timeout: 60000
          local-dir: dist/
          server-dir: ./
          dangerous-clean-slate: false
