name: Build Web PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure PHP CLI & pdo_sqlite for Security Tests
        run: |
          if ! php -m | grep -qi '^pdo_sqlite$'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-sqlite3
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Web PWA
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
